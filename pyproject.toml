[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plateqc"
version = "0.1.0"
description = "Microplate assay QC: Z'-factor, SSMD, and spatial diagnostics from plate reader exports"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Sri Gorantla"}]
keywords = ["lims", "laboratory-informatics", "assay", "quality-control", "zprime", "microplate"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
plateqc = "plateqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
